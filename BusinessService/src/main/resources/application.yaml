server:
  port: 8082

spring:
  application:
    name: BUSINESS-PROFILE-SERVICE

  r2dbc:
    url: r2dbc:h2:file:///./data/businessdb
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jackson:
    default-property-inclusion: non_null

  lifecycle:
    timeout-per-shutdown-phase: 20s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: false
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET:RiskTwinNexusJwtSecretKeyForDevelopmentOnly123456789}
  expiration: 3600000

notification-audit:
  service-url: http://localhost:8086

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.risktwin.business: INFO
    org.springframework.security: INFO
    org.springframework.r2dbc: INFO