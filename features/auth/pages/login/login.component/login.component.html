<div class="heading">
  <h2>Welcome back</h2>
  <p>Sign in to continue managing your insurance risk.</p>
</div>

@if (error$ | async; as error) {
  <div class="error">⚠ {{ error }}</div>
}

<form [formGroup]="form" (ngSubmit)="submit()">
  <label>
    Email
    <input
      type="email"
      formControlName="email"
      placeholder="you@company.com"
    />
  </label>

  <label>
    Password
    <input
      type="password"
      formControlName="password"
      placeholder="Enter your password"
    />
  </label>

  <button
    type="submit"
    [disabled]="form.invalid || (loading$ | async)"
  >
    @if (loading$ | async) {
      Signing in...
    } @else {
      Sign in →
    }
  </button>
</form>

<div class="divider">
  <span>New to RiskTwin?</span>
</div>

<a class="register" routerLink="/register">
  Create your account
</a>
